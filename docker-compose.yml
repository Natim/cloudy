# Single-server deployment: web (gunicorn), PostgreSQL and Redis.
#
# Coolify (Docker Compose build pack) fills the SERVICE_* variables itself:
# SERVICE_FQDN_WEB_8000 publishes the web service on the domain set in Coolify,
# SERVICE_PASSWORD_* and SERVICE_BASE64_* are generated once and kept.
# Without Coolify, set them in a .env file next to this one (see .env.example).

services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_WEB_8000
      - DJANGO_SECRET_KEY=${SERVICE_BASE64_64_DJANGO}
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=${SERVICE_FQDN_WEB},localhost,127.0.0.1
      - DJANGO_CSRF_TRUSTED_ORIGINS=${SERVICE_URL_WEB}
      - DJANGO_BEHIND_TLS_PROXY=true
      - DJANGO_SERVE_MEDIA=true
      - DATABASE_URL=postgres://db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cloudy}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=4
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-Cloudy <contact@cloudy.fr>}
      # Leave EMAIL_HOST empty to print emails (and sign-up codes) to the container logs.
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - STRIPE_FIRST_CLASS_SUBSCRIPTION=${STRIPE_FIRST_CLASS_SUBSCRIPTION:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - media:/app/media

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cloudy}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  media:
  postgres:
  redis:
