[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudy"
version = "1.0.0"
description = "Cloudy - online pilot logbooks"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = "~=3.14.0"
dependencies = [
    "beautifulsoup4",
    "django",
    "django-analytical",
    "django-compressor",
    "django-constance[redis]",
    "django-registration",
    "fdemmer-easy-thumbnails",
    "gunicorn",
    "hiredis",
    "pillow",
    "psycopg[binary]",
    "python-dateutil",
    "redis",
    "reportlab",
    "stripe",
    "whitenoise",
]

[project.urls]
Homepage = "https://www.cloudy.fr/"
Repository = "https://github.com/Natim/cloudy"

[tool.setuptools.packages.find]
include = ["cloudy*"]

[dependency-groups]
dev = [
    "django-debug-toolbar",
    "factory-boy",
    "freezegun",
    "pre-commit",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 110
fix = true
preview = false
extend-exclude = ["old_cloudy_27"]

[tool.ruff.lint]
ignore = [
    "F401",
    "F403",
    "F405",
    "F811",
    "F841",
    "DJ001",
    "DJ006",
    "DJ007",
    "E402",
    "E711",
    "E721",
    "E722",
    "E741",
    "E712",
    "PTH100",
    "PTH119",
    "PTH120",
    "PTH122",
    "PTH208",
    "RUF005",
    "RUF015",
    "RUF046",
    "RUF052",
    "RUF059",
    "UP031",
    "UP032",
    "UP047",
]
select = ["F", "I", "E4", "E7", "E9", "W6"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "RUF012"]

[tool.ruff.lint.isort]
order-by-type = false
known-first-party = ["cloudy"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cloudy.settings"
python_files = ["tests.py", "tests_*.py", "*_tests.py", "test_*.py"]
norecursedirs = ["old_cloudy_27", ".venv", "node_modules"]
testpaths = [
    "cloudy/tests",
    "cloudy/payment",
    "cloudy/time_format",
    "cloudy/core/tests",
    "cloudy/logbooks",
    "cloudy/imports",
    "cloudy/alerts",
    "cloudy/aircrafts",
    "cloudy/accounts",
]
