{% extends "admin/change_form.html" %}

{% block object-tools-items %}

  {% if impersonate_url %}

    <form method="post" action="{{ impersonate_url }}">
      {% csrf_token %}
      <a href="{{ impersonate_url }}" class="addlink" onclick="this.closest('form').submit(); return false;">Voir le site en tant que cet utilisateur</a>
    </form>
  </li>
  {% endif %}
{% endblock %}
